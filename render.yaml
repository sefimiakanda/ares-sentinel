# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Render Blueprint for Ares Sentinel.
# How to use: push this file to the ROOT of your GitHub repo, then on Render:
#   New + -> Blueprint -> select the repo -> Apply. Render will ask you for the secret value(s) below.
#
# One single web service: FastAPI computes the verdicts AND serves the web page (frontend/).

services:
  - type: web
    name: ares-sentinel
    runtime: python                 # Render runs the Python set in PYTHON_VERSION below (3.12).
                                    # backend/pyproject.toml must say requires-python = ">=3.12" (NOT a newer one),
                                    # and there must be no .python-version file asking for a newer Python.
    plan: free                      # free plan: the service sleeps after a while without visits
    branch: main                    # every push on this branch redeploys the site
    # No rootDir on purpose: the code reads ../data and ../frontend, which live outside backend/.
    #
    # Render only pre-installs uv when uv.lock sits at the repo ROOT (ours is in backend/), so we install uv
    # ourselves with pip, and call it as "python -m uv" so it works even if the "uv" command is not on the PATH.
    buildCommand: pip install uv && cd backend && python -m uv sync --frozen --no-dev
    # The environment was created in backend/.venv during the build: we start uvicorn straight from there.
    startCommand: cd backend && .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/sante     # Render checks that the server answers here
    envVars:
      - key: PYTHON_VERSION         # pyproject.toml asks for Python >= 3.12
        value: 3.12.11
      - key: OPENROUTER_API_KEY     # SECRET: configure it in Render; never commit it.
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
