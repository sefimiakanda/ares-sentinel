[project]
name = "ares-sentinel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.3",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]
[tool.uv]
package = false          # c'est une application, pas une bibliothèque à installer

[tool.pytest.ini_options]
pythonpath = ["."]       # permet à pytest de trouver le dossier app/

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
